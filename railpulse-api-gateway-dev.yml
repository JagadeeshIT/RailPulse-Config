server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: fleet-service
              uri: lb://railpulse-fleet-service
              predicates:
                - Path=/api/v1/locomotives/**

            - id: telemetry-service
              uri: lb://railpulse-telemetry-service
              predicates:
                - Path=/api/v1/telemetry/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
