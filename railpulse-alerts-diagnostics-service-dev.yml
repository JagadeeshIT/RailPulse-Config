server:
  port: 8084

spring:
  application:
    name: railpulse-alerts-diagnostics-service

  datasource:
    url: jdbc:mysql://localhost:3306/alerts_db
    username: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: alerts-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.railpulse.alertsDiagnostics.dto.request.TelemetryRequestDto
        spring.json.use.type.headers: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        
resilience4j:
  retry:
    instances:
      fleetService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.cloud.client.circuitbreaker.NoFallbackAvailableException

logging:
  level:
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.cloud.circuitbreaker: DEBUG
    io.github.resilience4j.retry: DEBUG


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
